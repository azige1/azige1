<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f2e9">
  <meta name="description" content="跟着一只鹈鹕，沿着海岸线慢慢骑。把晴日与落日装进一张会动的旅行明信片。">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='14' fill='%23f5f2e9'/%3E%3Cpath d='M10 31q17 7 18-8v-7q0-9 8-7 7 3 1 10-6 1-6 7-1 14-16 11' fill='%23fcf8e4' stroke='%23486f59' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='m37 14 10 3-11 3z' fill='%23dda76a'/%3E%3Ccircle cx='35' cy='12' r='1.3' fill='%232e5142'/%3E%3C/svg%3E">
  <title>慢慢骑 · 鹈鹕的海岸假日</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f2e9;
      --ink: #244b48;
      --muted: #7d8a7e;
      --line: #dcded0;
      --accent: #d57753;
    }
    * { box-sizing: border-box; }
    ::selection { color: #284e45; background: #dce7cd; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 28px 32px 24px;
      background: radial-gradient(ellipse at 10% 5%, #dfebde66, transparent 48%), var(--paper);
      color: var(--ink);
      font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    body::before {
      position: fixed;
      inset: 0;
      z-index: 5;
      content: "";
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath d='M0 0h180v180H0z' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E");
      background-size: 180px 180px;
      opacity: .13;
      pointer-events: none;
    }
    .page {
      width: min(100%, 1160px);
      --sky-top: #d2e8eb;
      --sky-bottom: #f3efd6;
      --sea-top: #80beb9;
      --sea-bottom: #b4d5c4;
      --hill-far: #b0c7b2;
      --hill-near: #96b7a5;
      --sun: #f2cc82;
      --sun-halo: #f8e4ae;
      --cloud: #fff9e9;
      --sand: #e9ddbb;
      --sand-edge: #d5d0a7;
      --water-line: #e6efcf;
      --reflection: #f7e6ad;
    }
    .page[data-light="sunset"] {
      --sky-top: #e8b8aa;
      --sky-bottom: #f6deba;
      --sea-top: #94afb0;
      --sea-bottom: #c9c5ad;
      --hill-far: #adaf9c;
      --hill-near: #8fa396;
      --sun: #eea76b;
      --sun-halo: #f5cb97;
      --cloud: #fae8cf;
      --sand: #e7cfac;
      --sand-edge: #c7bf9d;
      --water-line: #eadfc0;
      --reflection: #f9d09c;
    }
    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 18px;
      margin-bottom: 29px;
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-mark { width: 39px; height: 39px; }
    .brand-name { font-size: 14px; font-weight: 650; letter-spacing: .16em; }
    .brand-en { margin-top: 3px; color: var(--muted); font-size: 8px; letter-spacing: .19em; }
    .edition { display: flex; align-items: center; gap: 21px; color: var(--muted); font-size: 10px; letter-spacing: .13em; }
    .author { color: #516d60; text-decoration: none; letter-spacing: .02em; }
    .author:hover { color: var(--accent); }
    .eyebrow { display: flex; align-items: center; gap: 9px; margin: 0 0 12px; color: #89927d; font-size: 9px; letter-spacing: .19em; }
    .eyebrow::before { content: ""; width: 18px; height: 1px; background: var(--accent); }
    .intro {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 24px;
      margin-bottom: 28px;
    }
    h1 {
      margin: 0;
      font-family: "Songti SC", "Noto Serif CJK SC", "STSong", serif;
      font-size: clamp(32px, 4.7vw, 57px);
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: -.04em;
    }
    h1 em { position: relative; display: inline-block; color: var(--accent); font-style: normal; }
    h1 em::after { content: ""; position: absolute; left: 4%; bottom: -8px; width: 91%; height: 7px; border-top: 1.5px solid #d9a783; border-radius: 50%; transform: rotate(-2deg); }
    .intro-copy {
      margin: 0 0 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.95;
      padding-left: 19px;
      border-left: 1px solid #cdd5c5;
      text-align: left;
      letter-spacing: .045em;
      flex-shrink: 0;
    }
    .postcard {
      overflow: hidden;
      padding: 10px 10px 0;
      border: 1px solid #d7ddcf;
      border-radius: 20px;
      background: #fffdf4;
      box-shadow: 0 3px 5px #4c655806, 0 20px 46px -25px #4c655835;
    }
    .artwork { position: relative; overflow: hidden; border-radius: 11px; background: #d2e8eb; isolation: isolate; }
    .scene { display: block; width: 100%; height: auto; }
    .scene [fill], .scene [stroke], .scene stop { transition: fill .9s, stroke .9s, stop-color .9s; }
    #sun { transition: transform 1.4s cubic-bezier(.3, 0, .2, 1); }
    .page[data-light="sunset"] #sun { transform: translateY(145px); }
    #sea-glints { transition: opacity 1s; }
    .page[data-light="sunset"] #sea-glints { opacity: .86; }
    .weather {
      position: absolute;
      top: 21px;
      left: 22px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 11px;
      border: 1px solid #afc8b44a;
      border-radius: 30px;
      background: #fffdf252;
      color: #536f65;
      font-size: 10px;
      letter-spacing: .12em;
      pointer-events: none;
    }
    .weather svg { width: 16px; height: 16px; }
    .light-selector {
      position: absolute;
      z-index: 1;
      top: 21px;
      right: 22px;
      display: flex;
      gap: 3px;
      padding: 4px;
      border: 1px solid #fffdf280;
      border-radius: 30px;
      background: #fffdf260;
    }
    .light-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 30px;
      padding: 5px 13px;
      border: 0;
      border-radius: 20px;
      background: transparent;
      color: #628176;
      font-size: 10px;
      cursor: pointer;
      transition: background .25s, color .25s, box-shadow .25s;
    }
    .light-button svg { width: 14px; height: 14px; }
    .light-button[aria-pressed="true"] { color: #466458; background: #fffdf0; box-shadow: 0 2px 5px #4467540e; }
    .light-button:hover { color: #b36e48; }
    .scene-caption {
      position: absolute;
      left: 28px;
      bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #768470;
      font-size: 8px;
      letter-spacing: .19em;
      pointer-events: none;
    }
    .scene-caption::before { content: ""; width: 25px; height: 1px; background: currentColor; }
    .postmark {
      position: absolute;
      right: 22px;
      bottom: 17px;
      width: 64px;
      height: 64px;
      color: #89917a;
      opacity: .65;
      transform: rotate(-12deg);
      pointer-events: none;
    }
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      min-height: 94px;
      padding: 19px 17px;
    }
    .location { display: flex; align-items: center; gap: 13px; }
    .location-number {
      display: grid;
      place-items: center;
      width: 37px;
      height: 41px;
      border: 1px solid #d3dbcb;
      border-radius: 20px 20px 6px 6px;
      background: #f4f4e8;
      color: #8a9b7e;
      font-size: 11px;
      font-family: Georgia, serif;
    }
    .location-name { font-size: 13px; font-weight: 600; letter-spacing: .08em; }
    .status { display: flex; align-items: center; gap: 5px; margin-top: 5px; color: var(--muted); font-size: 10px; }
    .status-dot { width: 5px; height: 5px; border-radius: 50%; background: #87a175; transition: background .2s; }
    .is-paused .status-dot { background: #c6a66f; }
    .route-note { display: flex; flex-direction: column; align-items: center; gap: 6px; color: #84917d; }
    .route-note svg { width: 143px; height: 15px; }
    .route-note span { font-size: 9px; letter-spacing: .15em; }
    .playback { display: flex; align-items: center; gap: 22px; }
    .speed-control { display: flex; align-items: center; gap: 11px; }
    .speed-label { color: #80907c; font-size: 10px; letter-spacing: .05em; }
    input[type="range"] {
      --fill: 38%;
      appearance: none;
      -webkit-appearance: none;
      width: 98px;
      height: 32px;
      margin: 0;
      cursor: pointer;
      background: transparent;
      accent-color: var(--ink);
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 3px;
      border-radius: 3px;
      background: linear-gradient(to right, #78967a var(--fill), #dfe5d5 var(--fill));
    }
    input[type="range"]::-moz-range-track { height: 3px; border-radius: 3px; background: #dfe5d5; }
    input[type="range"]::-moz-range-progress { height: 3px; background: #78967a; }
    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      margin-top: -5.5px;
      border: 3px solid #fffdf4;
      border-radius: 50%;
      background: #456d55;
      box-shadow: 0 0 0 1px #456d5540;
    }
    input[type="range"]::-moz-range-thumb { width: 8px; height: 8px; border: 3px solid #fffdf4; border-radius: 50%; background: #456d55; }
    .speed-value { min-width: 30px; color: #526e55; font-size: 10px; font-variant-numeric: tabular-nums; }
    .motion-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-width: 112px;
      height: 44px;
      padding: 0 17px;
      border: 0;
      border-radius: 50%;
      color: #f8f9ed;
      background: #2d5d50;
      cursor: pointer;
      transition: background .2s, transform .2s;
    }
    .motion-toggle:hover { background: #447564; transform: translateY(-2px); box-shadow: 0 4px 10px #42695622; }
    .motion-toggle:active { transform: scale(.94); }
    .motion-toggle svg { width: 17px; height: 17px; }
    .motion-label { font-size: 11px; letter-spacing: .05em; }
    .icon-play { display: none; }
    .is-paused .icon-pause { display: none; }
    .is-paused .icon-play { display: block; }
    :focus-visible { outline: 2px solid #cc784c; outline-offset: 5px; border-radius: 4px; }
    .motion-toggle:focus-visible { border-radius: 30px; }
    .footnote { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 3px 0; color: #8d9888; }
    .footnote p { margin: 0; font-size: 10px; letter-spacing: .08em; }
    .footnote span { font-family: Georgia, serif; font-size: 11px; font-style: italic; letter-spacing: .03em; }
    @media (min-width: 1450px) { body { padding-top: 38px; padding-bottom: 30px; } }
    @media (max-width: 900px) {
      .intro-copy { font-size: 11px; }
      h1 { font-size: clamp(30px, 5vw, 43px); }
      .route-note { display: none; }
    }
    @media (max-width: 640px) {
      body { padding: 21px 13px 20px; }
      .masthead { margin-bottom: 26px; padding-bottom: 16px; }
      .edition { font-size: 10px; letter-spacing: .02em; }
      .edition-number { display: none; }
      .brand-name { font-size: 12px; }
      .brand-en { font-size: 7px; }
      .brand-mark { width: 33px; height: 33px; }
      .eyebrow { margin-bottom: 10px; font-size: 8px; }
      .intro { display: block; margin-bottom: 24px; padding: 0 4px; }
      h1 { font-size: clamp(27px, 7.4vw, 43px); line-height: 1.5; }
      h1 em::after { bottom: 1px; }
      .intro-copy { margin: 10px 0 0; padding: 0; border: 0; font-size: 11px; text-align: left; letter-spacing: .02em; }
      .intro-copy br { display: none; }
      .postcard { padding: 6px 6px 0; border-radius: 15px; }
      .artwork { border-radius: 9px; }
      .scene { width: 154%; max-width: none; margin-left: -27%; }
      .weather { top: 12px; left: 11px; padding: 6px 8px; gap: 5px; font-size: 8px; letter-spacing: .02em; }
      .weather svg { width: 12px; height: 12px; }
      .light-selector { top: 10px; right: 10px; padding: 3px; gap: 1px; }
      .light-button { min-height: 25px; padding: 4px 9px; gap: 4px; font-size: 9px; }
      .light-button svg { width: 12px; height: 12px; }
      .scene-caption { left: 14px; bottom: 14px; gap: 7px; font-size: 6px; }
      .scene-caption::before { width: 16px; }
      .postmark { right: 10px; bottom: 7px; width: 44px; height: 44px; }
      .controls { min-height: 82px; padding: 14px 8px; gap: 10px; }
      .location { gap: 8px; }
      .location-number { width: 29px; height: 35px; font-size: 10px; }
      .location-name { font-size: 11px; }
      .status { font-size: 9px; }
      .playback { gap: 12px; }
      .speed-control { gap: 7px; }
      .speed-label { display: none; }
      input[type="range"] { width: 56px; }
      .speed-value { font-size: 9px; min-width: 25px; }
      .motion-toggle { min-width: 39px; width: 39px; height: 39px; padding: 0; }
      .motion-label { display: none; }
      .footnote { padding-top: 15px; }
      .footnote p { font-size: 9px; letter-spacing: .015em; }
      .footnote span { font-size: 9px; }
    }
    @media (max-width: 360px) {
      .speed-control { gap: 5px; }
      input[type="range"] { width: 42px; }
      .playback { gap: 8px; }
      .location { gap: 6px; }
      .footnote span { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page" id="ride" data-light="day">
    <header class="masthead">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true">
          <rect x="1" y="1" width="38" height="38" rx="12" stroke="#b9c7ae"/>
          <path d="M10 27c9 3 14-1 14-8v-4c0-4 6-5 6-1l5 2-6 2c-1 8-5 13-13 12" stroke="#446951" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M13 21c-3 5 0 8 6 6" stroke="#446951" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="27.7" cy="13.5" r=".8" fill="#446951"/>
          <path d="M10 33h20" stroke="#b9c7ae" stroke-linecap="round"/>
        </svg>
        <div><div class="brand-name">慢游俱乐部</div><div class="brand-en">PELICAN CYCLING CLUB</div></div>
      </div>
      <div class="edition"><span class="edition-number">A LITTLE ESCAPE &nbsp; / &nbsp; Nº 001</span><a class="author" href="https://github.com/azige1" aria-label="前往 azige1 的 GitHub 主页">by azige1 ↗</a></div>
    </header>

    <div class="intro">
      <div><p class="eyebrow">给日常，留一点漫游的空白</p><h1>向海而行，<em>慢慢就好。</em></h1></div>
      <p class="intro-copy">今天的计划：没有计划。<br>只有海风，和一段刚刚好的路。</p>
    </div>

    <section class="postcard" aria-label="鹈鹕的海岸骑行">
      <div class="artwork">
        <div class="weather">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="3.3" stroke="currentColor" stroke-width="1.2"/><path d="M10 1.5v2M10 16.5v2M1.5 10h2M16.5 10h2M4 4l1.5 1.5M14.5 14.5 16 16M4 16l1.5-1.5M14.5 5.5 16 4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          <span id="weather-copy">晴日 &nbsp;·&nbsp; 海风刚刚好</span>
        </div>
        <div class="light-selector" role="group" aria-label="选择海岸光线">
          <button class="light-button" type="button" data-light="day" aria-pressed="true"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="3.2" stroke="currentColor" stroke-width="1.3"/><path d="M10 2v2m0 12v2M2 10h2m12 0h2M4.4 4.4l1.4 1.4m8.4 8.4 1.4 1.4m0-11.2-1.4 1.4m-8.4 8.4-1.4 1.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>晴日</button>
          <button class="light-button" type="button" data-light="sunset" aria-pressed="false"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M5 12a5 5 0 0 1 10 0M2 13h16M5 16h10M10 2v2M3 6l1.5 1M17 6l-1.5 1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>落日</button>
        </div>

        <svg class="scene" viewBox="0 0 1120 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="scene-title scene-description">
          <title id="scene-title">戴着绿帽子的鹈鹕，骑着橘红色自行车沿海岸前行</title>
          <desc id="scene-description">白色鹈鹕的大嘴下垂着橙色喉囊，围巾随风摆动，双脚交替踩动踏板。车轮转动，云朵、海浪和路旁的小花向后流动。可使用下方控件暂停或调节速度。</desc>
          <defs>
            <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
              <stop stop-color="var(--sky-top)"/><stop offset="1" stop-color="var(--sky-bottom)"/>
            </linearGradient>
            <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
              <stop stop-color="var(--sea-top)"/><stop offset="1" stop-color="var(--sea-bottom)"/>
            </linearGradient>
            <linearGradient id="bill" x1="0" y1="0" x2="0" y2="1">
              <stop stop-color="#efc27b"/><stop offset="1" stop-color="#dfa067"/>
            </linearGradient>
            <linearGradient id="bicycle-paint" gradientUnits="userSpaceOnUse" x1="350" y1="330" x2="650" y2="450">
              <stop stop-color="#e59a72"/><stop offset=".5" stop-color="#d87c57"/><stop offset="1" stop-color="#c96c4f"/>
            </linearGradient>
            <radialGradient id="ground-shadow">
              <stop stop-color="#667953" stop-opacity=".24"/><stop offset="1" stop-color="#667953" stop-opacity="0"/>
            </radialGradient>
            <pattern id="water-lines" width="270" height="59" patternUnits="userSpaceOnUse">
              <path d="M19 13h68m88 20h45M109 49h29" fill="none" stroke="var(--water-line)" stroke-width="2" stroke-linecap="round" opacity=".62"/>
              <path d="M97 13h8m137 20h11M29 49h36" fill="none" stroke="var(--water-line)" stroke-width="1.2" stroke-linecap="round" opacity=".4"/>
            </pattern>
            <pattern id="road-marks" width="185" height="28" patternUnits="userSpaceOnUse">
              <path d="M15 14h69" stroke="#faf5df" stroke-width="3" stroke-linecap="round"/>
            </pattern>
            <g id="clouds" fill="var(--cloud)">
              <path d="M78 130c0-10 8-18 18-18 2-18 15-29 32-29 20 0 35 14 36 32 14-5 27 4 28 15z"/>
              <path d="M332 85c1-10 8-16 18-16 2-13 13-22 26-22 15 0 27 11 28 24 10-2 19 4 21 14z" opacity=".75"/>
              <path d="M948 171c0-10 7-17 17-17 3-17 16-28 33-28 19 0 34 13 36 30 13-2 23 4 26 15z" opacity=".85"/>
            </g>
            <g id="coastal-hills">
              <path d="M0 316c55-23 96-14 150-33 69-24 111-61 181-60 80 0 110 57 175 67 61 9 80-17 143-5 75 14 107 42 182 28 119-23 194-20 289 3v34H0z" fill="var(--hill-far)"/>
              <path d="M0 328c86-16 139 6 219-9 71-14 105-30 178-25 88 6 141 39 237 30 102-10 140-16 220-8 92 10 170-7 266 12v25H0z" fill="var(--hill-near)"/>
              <path d="M201 299c26-25 66-35 91-34m38-19q25 2 48 18m-127 48q42-15 71-9" fill="none" stroke="#e5e9cb" stroke-width="2" stroke-linecap="round" opacity=".5"/>
              <g fill="#688b78" opacity=".27">
                <path d="m255 287 5-22 5 22zm17-6 6-29 6 29zm25-4 5-22 5 22zm424 43 4-17 4 17zm14-3 5-23 5 23z"/>
              </g>
            </g>
            <g id="daisy">
              <g fill="#fff7dc"><ellipse cy="-6" rx="2.6" ry="5"/><ellipse cy="6" rx="2.6" ry="5"/><ellipse cx="-6" rx="5" ry="2.6"/><ellipse cx="6" rx="5" ry="2.6"/><g transform="rotate(45)"><ellipse cy="-6" rx="2.6" ry="5"/><ellipse cy="6" rx="2.6" ry="5"/><ellipse cx="-6" rx="5" ry="2.6"/><ellipse cx="6" rx="5" ry="2.6"/></g></g>
              <circle r="3.6" fill="#d9a958"/><circle cx="-1" cy="-1" r="1" fill="#f5d186"/>

  <script>
    (() => {
      const byId = (id) => document.getElementById(id);
      const ride = byId('ride');
      const toggle = byId('motion-toggle');
      const speedInput = byId('speed');
      const status = byId('ride-status');
      const lightButtons = [...document.querySelectorAll('.light-button')];
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const parts = Object.fromEntries([
        'rear-wheel', 'front-wheel', 'crank', 'far-leg', 'near-leg',
        'near-leg-highlight', 'far-pedal', 'near-pedal', 'pelican',
        'scarf-tail', 'ground-track', 'cloud-track', 'hill-track',
        'lighthouse', 'gulls', 'wind', 'water-lines', 'road-marks', 'ride-shadow',
        'foreground-track', 'sailboat', 'sea-glints', 'pannier-flowers'
      ].map((id) => [id, byId(id)]));

      let playing = !reducedMotion.matches;
      let speed = Number(speedInput.value);
      let elapsed = 0;
      let previousTime = null;
      let frameId = null;

      const translate = (x, y = 0) => `translate(${x.toFixed(3)} ${y.toFixed(3)})`;

      // A two-link leg keeps each ankle attached to its own moving pedal.
      function legPath(hipX, hipY, ankleX, ankleY) {
        const upper = 76;
        const lower = 79;
        const dx = ankleX - hipX;
        const dy = ankleY - hipY;
        const distance = Math.hypot(dx, dy);
        const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
        const bend = Math.sqrt(Math.max(0, upper * upper - along * along));
        const kneeX = hipX + dx / distance * along + dy / distance * bend;
        const kneeY = hipY + dy / distance * along - dx / distance * bend;
        return `M${hipX} ${hipY} L${kneeX.toFixed(3)} ${kneeY.toFixed(3)} L${ankleX.toFixed(3)} ${ankleY.toFixed(3)}`;
      }

      function render(time) {
        const phase = time * Math.PI * 2 / 1.65;
        const angle = phase * 180 / Math.PI;
        const bob = Math.sin(phase * 2) * 1.35;
        const pedalX = 500 + Math.cos(phase) * 33;
        const pedalY = 443 + Math.sin(phase) * 33;
        const farX = 500 - Math.cos(phase) * 33;
        const farY = 443 - Math.sin(phase) * 33;

        // Wheel travel, landscape travel and pedalling share one clock.
        const travel = time * 132;
        const wheelAngle = travel / 98 * 180 / Math.PI;
        parts['rear-wheel'].setAttribute('transform', `rotate(${wheelAngle % 360})`);
        parts['front-wheel'].setAttribute('transform', `rotate(${wheelAngle % 360})`);
        parts.crank.setAttribute('transform', `translate(500 443) rotate(${angle % 360})`);
        parts['near-pedal'].setAttribute('transform', translate(pedalX, pedalY));
        parts['far-pedal'].setAttribute('transform', translate(farX, farY));
        const nearLeg = legPath(486, 331 + bob, pedalX, pedalY - 8);
        parts['near-leg'].setAttribute('d', nearLeg);
        parts['near-leg-highlight'].setAttribute('d', nearLeg);
        parts['far-leg'].setAttribute('d', legPath(478, 331 + bob, farX, farY - 8));
        parts.pelican.setAttribute('transform', translate(0, bob));
        parts['scarf-tail'].setAttribute('transform', `rotate(${Math.sin(phase * 1.5) * 4} 544 241)`);
        parts['pannier-flowers'].setAttribute('transform', `rotate(${Math.sin(phase * .85) * 1.8} 307 337)`);
        parts['ground-track'].setAttribute('transform', translate(-(travel % 1120)));
        parts['foreground-track'].setAttribute('transform', translate(-((travel * 1.18) % 1120)));
        parts['cloud-track'].setAttribute('transform', translate(-((time * 5) % 1120)));
        parts['hill-track'].setAttribute('transform', translate(-((time * 11) % 1120)));
        parts.lighthouse.setAttribute('transform', translate(-((time * 11 + 200) % 1360) + 200));
        parts['water-lines'].setAttribute('patternTransform', translate(-((time * 24) % 270)));
        parts['road-marks'].setAttribute('patternTransform', translate(-(travel % 185)));
        parts.sailboat.setAttribute('transform', translate(1000 - ((time * 7 + 1000) % 1400), Math.sin(time * .85) * 1.25));
        parts['sea-glints'].setAttribute('transform', translate(Math.sin(time * .8) * 3));
        parts.gulls.setAttribute('transform', translate(Math.sin(time * .35) * 9, Math.sin(time * .9) * 3));
        parts.wind.setAttribute('transform', translate(-((time * 22) % 45)));
        parts.wind.setAttribute('opacity', String(.35 + (Math.sin(time * 3) + 1) * .2));
        parts['ride-shadow'].setAttribute('rx', String(282 + bob * 2));

        // An occasional, brief blink gives the rider a little life.
        const eye = Math.floor(time / 4.8);
        const blink = time - eye * 4.8;
        const eyeScale = blink > 4.61 && blink < 4.75 ? .15 : 1;
        eyeGroup.setAttribute('transform', `translate(0 ${191 * (1 - eyeScale)}) scale(1 ${eyeScale})`);
      }

      // Group only the pupil and its catchlight so the eyelid can blink.
      const eyeGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      const pupil = parts.pelican.querySelector('circle[cx="598"]');
      const catchlight = pupil.nextElementSibling;
      pupil.before(eyeGroup);
      eyeGroup.append(pupil, catchlight);

      function tick(now) {
        if (!playing) return;
        if (previousTime !== null) elapsed += Math.min((now - previousTime) / 1000, .06) * speed;
        previousTime = now;
        render(elapsed);
        frameId = requestAnimationFrame(tick);
      }

      function updatePlayback() {
        ride.classList.toggle('is-paused', !playing);
        const label = playing ? '暂停动画' : '继续动画';
        toggle.setAttribute('aria-label', label);
        toggle.setAttribute('title', label);
        toggle.setAttribute('aria-pressed', String(!playing));
        byId('motion-label').textContent = playing ? '歇一会儿' : '继续出发';
        status.textContent = playing ? '顺风骑行中' : '停下来，看看海';
        cancelAnimationFrame(frameId);
        previousTime = null;
        if (playing && !document.hidden) frameId = requestAnimationFrame(tick);
      }

      function updateSpeed() {
        speed = Number(speedInput.value);
        byId('speed-value').value = `${speed.toFixed(1)}×`;
        speedInput.setAttribute('aria-valuetext', `${speed.toFixed(1)} 倍速度`);
        const progress = (speed - Number(speedInput.min)) / (Number(speedInput.max) - Number(speedInput.min)) * 100;
        speedInput.style.setProperty('--fill', `${progress}%`);
      }

      function setLight(light) {
        const selected = light === 'sunset' ? 'sunset' : 'day';
        ride.dataset.light = selected;
        lightButtons.forEach((button) => {
          button.setAttribute('aria-pressed', String(button.dataset.light === selected));
        });
        byId('weather-copy').textContent = selected === 'sunset' ? '落日 · 把温柔留久一点' : '晴日 · 海风刚刚好';
        try { localStorage.setItem('pelican-coast-light', selected); } catch {}
      }

      toggle.addEventListener('click', () => { playing = !playing; updatePlayback(); });
      speedInput.addEventListener('input', updateSpeed);
      lightButtons.forEach((button) => button.addEventListener('click', () => setLight(button.dataset.light)));
      reducedMotion.addEventListener('change', (event) => { playing = !event.matches; updatePlayback(); });
      document.addEventListener('visibilitychange', () => {
        cancelAnimationFrame(frameId);
        previousTime = null;
        if (!document.hidden && playing) frameId = requestAnimationFrame(tick);
      });

      updateSpeed();
      render(0);
      updatePlayback();
      let savedLight = 'day';
      try { savedLight = localStorage.getItem('pelican-coast-light') || 'day'; } catch {}
      setLight(savedLight);
    })();
  </script>
</body>
</html>
